name: Veille laffaire_france

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (dépôt privé : quota gratuit de 2000 min/mois) (GitHub peut retarder de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

concurrency:
  group: veille
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Récupérer l'état (branche « etat »)
        run: |
          mkdir -p donnees
          git fetch origin etat --depth=1 && git show origin/etat:etat.json > donnees/etat.json || echo "premier tour"
      - name: Tour de veille
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python veille.py
      - name: Enregistrer l'état (écrase la branche, sans historique)
        if: always()
        run: |
          [ -s donnees/etat.json ] || exit 0
          d=$(mktemp -d); cp donnees/etat.json "$d/"; cd "$d"
          git init -q -b etat; git add etat.json
          git -c user.name=veille-bot -c user.email=veille-bot@users.noreply.github.com commit -qm etat
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" etat
      - name: Enregistrer les dossiers préparés
        if: always()
        run: |
          git add sujets 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git -c user.name=veille-bot -c user.email=veille-bot@users.noreply.github.com commit -m "sujet préparé"
          git pull --rebase && git push
