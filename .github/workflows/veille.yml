name: Veille laffaire_france

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 min (dépôt public depuis le 08/11 : minutes illimitées)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

concurrency:
  group: veille
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Récupérer l'état (branche « etat »)
        run: |
          mkdir -p donnees
          git fetch origin etat --depth=1 && git show origin/etat:etat.json > donnees/etat.json || echo "premier tour"
          git show origin/etat:viral.json > donnees/viral.json 2>/dev/null || rm -f donnees/viral.json
          git show origin/etat:suivi.json > donnees/suivi.json 2>/dev/null || rm -f donnees/suivi.json
          git show origin/etat:espion.json > donnees/espion.json 2>/dev/null || rm -f donnees/espion.json
      - name: Veille + bot viral + observateur
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TOKEN_VIRAL: ${{ secrets.TELEGRAM_TOKEN_VIRAL }}
          TELEGRAM_TOKEN_ESPION: ${{ secrets.TELEGRAM_TOKEN_ESPION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # espion.py (comptes observés + analyse de leur méthode) tourne EN MÊME TEMPS que veille.py puis viral.py : il lit ses
        # 6 comptes TikTok pendant veille.py (qui ne touche pas TikTok), puis télécharge et fait analyser : le tour reste < 60 s
        run: |
          python espion.py > espion.log 2>&1 &
          e=$!
          python veille.py || r=$?
          echo "veille : ${SECONDS} s"
          python viral.py || r=$?
          echo "veille + viral : ${SECONDS} s"
          wait $e || echo "espion en échec"
          echo "fin observateur : ${SECONDS} s"
          cat espion.log
          exit ${r:-0}
      - name: Suivi de mes vidéos + meilleures heures
        if: always()
        env:
          TELEGRAM_TOKEN_VIRAL: ${{ secrets.TELEGRAM_TOKEN_VIRAL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python suivi.py
      - name: Enregistrer l'état (écrase la branche, sans historique)
        if: always()
        run: |
          [ -s donnees/etat.json ] || exit 0
          d=$(mktemp -d); cp donnees/etat.json "$d/"; [ -f donnees/viral.json ] && cp donnees/viral.json "$d/"; [ -f donnees/suivi.json ] && cp donnees/suivi.json "$d/"; [ -f donnees/espion.json ] && cp donnees/espion.json "$d/"; cd "$d"
          git init -q -b etat; git add *.json
          git -c user.name=veille-bot -c user.email=veille-bot@users.noreply.github.com commit -qm etat
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" etat
      - name: Enregistrer les dossiers préparés
        if: always()
        run: |
          git add sujets 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git -c user.name=veille-bot -c user.email=veille-bot@users.noreply.github.com commit -m "sujet préparé"
          git pull --rebase --autostash && git push
